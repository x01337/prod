version: "3.9"

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  replyai_net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:         # persistent PostgreSQL data
  sqlite_data:           # persistent SQLite data (dev fallback)

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: replyai_postgres
    restart: unless-stopped
    networks: [replyai_net]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       replyai
      POSTGRES_USER:     replyai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replyai_dev_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replyai -d replyai"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Don't expose 5432 publicly — app connects via internal network
    # Uncomment to connect from host for debugging:
    # ports:
    #   - "5432:5432"

  # ── Next.js app ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${SITE_URL:-http://localhost:3000}
    container_name: replyai_app
    restart: unless-stopped
    networks: [replyai_net]
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - sqlite_data:/app/data   # SQLite fallback persistence
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000

      # Database — connect to the postgres container above
      DATABASE_URL: postgresql://replyai:${POSTGRES_PASSWORD:-replyai_dev_pass}@postgres:5432/replyai

      # Auth — REQUIRED: set a strong secret in .env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and fill in values.}

      # Email (optional)
      EMAIL_USER:  ${EMAIL_USER:-}
      EMAIL_PASS:  ${EMAIL_PASS:-}
      EMAIL_FROM:  ${EMAIL_FROM:-}

      # WhatsApp (optional)
      WHATSAPP_VERIFY_TOKEN:  ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN:  ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET:    ${WHATSAPP_APP_SECRET:-}

      # AI fallback (optional)
      AI_ENABLED:  ${AI_ENABLED:-false}
      AI_API_KEY:  ${AI_API_KEY:-}
      AI_MODEL:    ${AI_MODEL:-mistralai/mistral-7b-instruct:free}

      # App URL (used in emails, webhooks)
      SITE_URL: ${SITE_URL:-http://localhost:3000}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Cloudflare Tunnel (optional — uncomment to expose publicly) ─────────────
  # Prerequisite: set CLOUDFLARE_TUNNEL_TOKEN in your .env file
  # Get token at: dash.cloudflare.com -> Zero Trust -> Access -> Tunnels
  #
  # cloudflare_tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: replyai_tunnel
  #   restart: unless-stopped
  #   networks: [replyai_net]
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - app
